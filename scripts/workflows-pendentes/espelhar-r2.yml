# Produção (R2) é a fonte da verdade do HTML. Esta Action copia o atlas.html publicado para www/index.html,
# byte a byte, sempre que VERSION muda (ou manualmente / todo dia às 6h UTC). Sem segredos: o bucket é público.
name: espelhar-r2
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: write
jobs:
  espelhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar do R2 o que está no ar (atlas.html e, desde a v39, painel, privacidade, índice de busca e VERSION.json)
        run: |
          R2=https://pub-58f587f01b32444d95df39d7dfb2d438.r2.dev; nc="nc=$(date +%s)"
          curl -fsSL "$R2/atlas.html?$nc" -o www/index.html
          test "$(wc -c < www/index.html)" -gt 100000
          for f in painel.html privacidade.html busca-index.json VERSION.json; do curl -fsSL "$R2/$f?$nc" -o "www/$f" || echo "aviso: $f não está no R2"; done
          echo "no ar: $(grep -o '<!-- v[0-9]* -->' www/index.html)  ·  VERSION: $(cat VERSION)  ·  VERSION.json: $(cat www/VERSION.json)"
      - name: Commitar se mudou
        run: |
          git config user.name "atlas-espelho"
          git config user.email "actions@users.noreply.github.com"
          git add www/index.html www/painel.html www/privacidade.html www/busca-index.json www/VERSION.json
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "Espelho de produção: $(grep -o '<!-- v[0-9]* -->' www/index.html | tr -d '<>! -')"
          git push
